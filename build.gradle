plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "SakuraRyoko"
		url = "https://maven.sakuraryoko.com/"
		content {
			includeModule("com.terraformersmc", "modmenu")
		}
	}
	maven { url = "https://maven.isxander.dev/releases" }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
		content {
			includeModule("com.terraformersmc", "modmenu")
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecartvisualizer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Fix launch.cfg paths when project directory contains spaces (Windows)
tasks.register('fixLaunchCfg') {
    doLast {
        def batFile = file('fix_launch_cfg.bat')
        if (!batFile.exists()) return

        def pb = new ProcessBuilder(batFile.absolutePath)
        pb.directory(project.projectDir)
        pb.redirectErrorStream(true)
        def proc = pb.start()
        def output = proc.inputStream.text
        proc.waitFor()
        if (!output.empty) println output.trim()
    }
}

tasks.matching { it.name == 'genSources' }.configureEach {
    finalizedBy 'fixLaunchCfg'
}